<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Habit Dashboard</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts (Inter for a clean, data-dashboard look) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        dashboard: {
                            bg: '#f3f4f6',      /* Gray 100 */
                            card: '#ffffff',
                            border: '#e5e7eb',  /* Gray 200 */
                            text: '#111827',    /* Gray 900 */
                            muted: '#6b7280',   /* Gray 500 */
                            primary: '#0ea5e9', /* Sky 500 */
                            success: '#10b981', /* Emerald 500 */
                            danger: '#ef4444',  /* Red 500 */
                        }
                    },
                    boxShadow: {
                        'card': '0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px 0 rgba(0, 0, 0, 0.06)',
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: theme('colors.dashboard.bg');
            color: theme('colors.dashboard.text');
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        /* Sleek scrollbar for the horizontal chain */
        .chain-container::-webkit-scrollbar {
            height: 6px;
        }
        .chain-container::-webkit-scrollbar-track {
            background: transparent;
        }
        .chain-container::-webkit-scrollbar-thumb {
            background-color: theme('colors.gray.300');
            border-radius: 10px;
        }
        .chain-container::-webkit-scrollbar-thumb:hover {
            background-color: theme('colors.gray.400');
        }

        /* Node animation */
        @keyframes pop {
            0% { transform: scale(0.95); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        .node-active {
            animation: pop 0.2s ease-out forwards;
        }

        /* Connecting line for the chain */
        .chain-link {
            position: relative;
        }
        .chain-link::after {
            content: '';
            position: absolute;
            top: 50%;
            right: -100%;
            width: 100%;
            height: 2px;
            background-color: theme('colors.gray.200');
            transform: translateY(-50%);
            z-index: 0;
        }
        .chain-link:last-child::after {
            display: none;
        }
        .chain-link.completed::after {
            background-color: theme('colors.dashboard.success');
            opacity: 0.5;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col md:flex-row">

    <aside class="w-full md:w-64 bg-slate-900 text-white flex flex-col md:min-h-screen shadow-xl z-20 shrink-0">
        <div class="p-6 flex items-center gap-3 border-b border-slate-800">
            <div class="w-8 h-8 rounded bg-dashboard-primary flex items-center justify-center text-white">
                <i class="ph ph-chart-line-up text-xl"></i>
            </div>
            <h1 class="font-bold text-lg tracking-wide">Tracker<span class="text-dashboard-primary">Pro</span></h1>
        </div>
        
        <nav class="flex-1 p-4 space-y-2">
            <a href="#" class="flex items-center gap-3 px-4 py-3 bg-slate-800 rounded-lg text-white font-medium transition-colors">
                <i class="ph ph-calendar-check text-lg"></i>
                Habits
            </a>
            <a href="#" class="flex items-center gap-3 px-4 py-3 text-slate-400 hover:bg-slate-800 hover:text-white rounded-lg font-medium transition-colors cursor-not-allowed opacity-50">
                <i class="ph ph-trend-up text-lg"></i>
                Analytics
            </a>
            <a href="#" class="flex items-center gap-3 px-4 py-3 text-slate-400 hover:bg-slate-800 hover:text-white rounded-lg font-medium transition-colors cursor-not-allowed opacity-50">
                <i class="ph ph-gear text-lg"></i>
                Settings
            </a>
        </nav>

        <div class="p-4 border-t border-slate-800 text-xs text-slate-500 text-center">
            Dashboard v1.0
        </div>
    </aside>

    <main class="flex-1 flex flex-col min-w-0 h-screen overflow-hidden">
        <!-- Top Header -->
        <header class="bg-white border-b border-dashboard-border h-16 flex items-center justify-between px-6 shrink-0 shadow-sm z-10">
            <h2 class="text-lg font-semibold text-dashboard-text">Habit Tracking Overview</h2>
            <div class="flex items-center gap-4">
                <span id="currentDateDisplay" class="text-sm font-medium text-dashboard-muted bg-gray-50 px-3 py-1.5 rounded-md border border-gray-100"></span>
            </div>
        </header>

        <!-- Scrollable Content -->
        <div class="flex-1 overflow-y-auto p-6 md:p-8">
            <div class="max-w-6xl mx-auto space-y-6">
                
                <!-- Add Habit Widget -->
                <div class="bg-white rounded-xl shadow-card border border-dashboard-border p-5 flex flex-col md:flex-row gap-4 items-center justify-between">
                    <div class="flex-1 w-full">
                        <label for="habitInput" class="sr-only">New Habit Name</label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                <i class="ph ph-plus-circle text-gray-400 text-lg"></i>
                            </div>
                            <input 
                                type="text" 
                                id="habitInput" 
                                class="block w-full pl-10 pr-3 py-2.5 border border-gray-300 rounded-lg leading-5 bg-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-dashboard-primary focus:border-dashboard-primary sm:text-sm transition-shadow" 
                                placeholder="Define a new metric to track (e.g., Read 30 mins, Exercise)"
                            >
                        </div>
                    </div>
                    <button 
                        id="addHabitBtn"
                        class="w-full md:w-auto bg-slate-900 hover:bg-slate-800 text-white px-6 py-2.5 rounded-lg font-medium text-sm transition-colors shadow-sm flex items-center justify-center gap-2 whitespace-nowrap"
                    >
                        Create Habit
                    </button>
                </div>

                <!-- Summary Stats -->
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4" id="statsContainer">
                    <!-- Stats injected via JS -->
                </div>

                <!-- Habits List -->
                <div id="habitList" class="space-y-4">
                    <!-- Cards injected via JS -->
                </div>

                <!-- Empty State -->
                <div id="emptyState" class="hidden flex flex-col items-center justify-center py-20 bg-white rounded-xl border border-dashed border-gray-300">
                    <div class="w-16 h-16 bg-gray-50 rounded-full flex items-center justify-center mb-4 text-gray-400">
                        <i class="ph ph-rows text-2xl"></i>
                    </div>
                    <h3 class="text-base font-semibold text-dashboard-text">No Tracking Data Found</h3>
                    <p class="text-sm text-dashboard-muted mt-1">Initialize a new habit using the form above.</p>
                </div>

            </div>
        </div>
    </main>

    <!-- Custom Confirm Modal -->
    <div id="confirmModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4 opacity-0 transition-opacity duration-200">
        <div class="bg-white rounded-xl shadow-xl border border-gray-200 w-full max-w-sm p-6 transform scale-95 transition-transform duration-200" id="confirmModalCard">
            <h3 class="text-lg font-semibold text-dashboard-text mb-2">Delete Tracking Data?</h3>
            <p class="text-sm text-dashboard-muted mb-6">This action will permanently remove the habit and all its historical data. This cannot be undone.</p>
            <div class="flex justify-end gap-3">
                <button id="cancelDeleteBtn" class="px-4 py-2 text-sm font-medium text-dashboard-text bg-white border border-gray-300 rounded-lg hover:bg-gray-50 transition-colors">
                    Cancel
                </button>
                <button id="confirmDeleteBtn" class="px-4 py-2 text-sm font-medium text-white bg-dashboard-danger rounded-lg hover:bg-red-600 transition-colors">
                    Delete Data
                </button>
            </div>
        </div>
    </div>

    <script>
        // Data Structure & Constants
        const STORAGE_KEY = 'dashboard_habits_v1';
        const DAYS_TO_SHOW = 21; // 3 weeks for a clean dashboard fit
        let habits = [];
        let habitToDelete = null;

        // DOM Elements
        const habitInput = document.getElementById('habitInput');
        const addHabitBtn = document.getElementById('addHabitBtn');
        const habitList = document.getElementById('habitList');
        const emptyState = document.getElementById('emptyState');
        const dateDisplay = document.getElementById('currentDateDisplay');
        const statsContainer = document.getElementById('statsContainer');
        
        // Modal Elements
        const confirmModal = document.getElementById('confirmModal');
        const confirmModalCard = document.getElementById('confirmModalCard');
        const cancelDeleteBtn = document.getElementById('cancelDeleteBtn');
        const confirmDeleteBtn = document.getElementById('confirmDeleteBtn');

        function init() {
            // Set Date
            const now = new Date();
            dateDisplay.innerHTML = `<i class="ph ph-calendar-blank inline mr-1"></i> ${now.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })}`;

            // Load Data
            try {
                const data = localStorage.getItem(STORAGE_KEY);
                if (data) habits = JSON.parse(data);
            } catch (e) {
                console.error("Data load failed", e);
                habits = [];
            }

            // Event Listeners
            addHabitBtn.addEventListener('click', handleAddHabit);
            habitInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') handleAddHabit();
            });

            cancelDeleteBtn.addEventListener('click', closeDeleteModal);
            confirmDeleteBtn.addEventListener('click', executeDelete);

            render();
        }

        function getPastDates(numDays) {
            const dates = [];
            const today = new Date();
            // Start from numDays - 1 ago, up to today
            for (let i = numDays - 1; i >= 0; i--) {
                const d = new Date(today);
                d.setDate(today.getDate() - i);
                dates.push(formatDate(d));
            }
            return dates;
        }

        function formatDate(date) {
            // YYYY-MM-DD local time handling
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        function calculateStreak(history) {
            let streak = 0;
            const today = new Date();
            let currentDateStr = formatDate(today);
            
            if (!history[currentDateStr]) {
                const yesterday = new Date(today);
                yesterday.setDate(today.getDate() - 1);
                currentDateStr = formatDate(yesterday);
                if (!history[currentDateStr]) return 0;
            }

            let d = new Date(currentDateStr);
            while (history[formatDate(d)]) {
                streak++;
                d.setDate(d.getDate() - 1);
            }
            return streak;
        }

        function saveData() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(habits));
        }

        function handleAddHabit() {
            const name = habitInput.value.trim();
            if (!name) return;

            habits.unshift({
                id: crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(),
                name: name,
                history: {},
                createdAt: new Date().toISOString()
            });

            habitInput.value = '';
            saveData();
            render();
        }

        function toggleDay(habitId, dateStr) {
            const habit = habits.find(h => h.id === habitId);
            if (!habit) return;

            if (habit.history[dateStr]) {
                delete habit.history[dateStr];
            } else {
                habit.history[dateStr] = true;
            }
            
            saveData();
            render();
        }

        function openDeleteModal(id) {
            habitToDelete = id;
            confirmModal.classList.remove('hidden');
            // Trigger reflow for transition
            void confirmModal.offsetWidth;
            confirmModal.classList.remove('opacity-0');
            confirmModalCard.classList.remove('scale-95');
        }

        function closeDeleteModal() {
            habitToDelete = null;
            confirmModal.classList.add('opacity-0');
            confirmModalCard.classList.add('scale-95');
            setTimeout(() => {
                confirmModal.classList.add('hidden');
            }, 200);
        }

        function executeDelete() {
            if (habitToDelete) {
                habits = habits.filter(h => h.id !== habitToDelete);
                saveData();
                render();
            }
            closeDeleteModal();
        }

        function renderStats() {
            if (habits.length === 0) {
                statsContainer.innerHTML = '';
                return;
            }

            const totalHabits = habits.length;
            let totalActiveStreaks = 0;
            let highestStreak = 0;

            habits.forEach(h => {
                const streak = calculateStreak(h.history);
                if (streak > 0) totalActiveStreaks++;
                if (streak > highestStreak) highestStreak = streak;
            });

            statsContainer.innerHTML = `
                <div class="bg-white p-4 rounded-xl shadow-card border border-dashboard-border flex flex-col justify-center">
                    <span class="text-xs font-semibold text-dashboard-muted uppercase tracking-wider mb-1">Active Metrics</span>
                    <span class="text-2xl font-bold text-dashboard-text">${totalHabits}</span>
                </div>
                <div class="bg-white p-4 rounded-xl shadow-card border border-dashboard-border flex flex-col justify-center">
                    <span class="text-xs font-semibold text-dashboard-muted uppercase tracking-wider mb-1">Maintained Streaks</span>
                    <span class="text-2xl font-bold text-dashboard-primary">${totalActiveStreaks}</span>
                </div>
                <div class="bg-white p-4 rounded-xl shadow-card border border-dashboard-border flex flex-col justify-center">
                    <span class="text-xs font-semibold text-dashboard-muted uppercase tracking-wider mb-1">Top Streak</span>
                    <span class="text-2xl font-bold text-dashboard-success flex items-baseline gap-1">
                        ${highestStreak} <span class="text-sm font-medium text-dashboard-muted">days</span>
                    </span>
                </div>
            `;
        }

        function render() {
            renderStats();

            if (habits.length === 0) {
                habitList.innerHTML = '';
                emptyState.classList.remove('hidden');
                return;
            } else {
                emptyState.classList.add('hidden');
            }

            habitList.innerHTML = '';
            const dates = getPastDates(DAYS_TO_SHOW);
            const todayStr = formatDate(new Date());

            habits.forEach(habit => {
                const streak = calculateStreak(habit.history);
                const isActive = streak > 0;
                
                const card = document.createElement('div');
                card.className = "bg-white rounded-xl shadow-card border border-dashboard-border p-5 flex flex-col xl:flex-row xl:items-center gap-6";

                // Info Section
                const infoHtml = `
                    <div class="flex-1 min-w-[200px] flex justify-between items-start xl:items-center">
                        <div>
                            <h3 class="font-semibold text-dashboard-text text-base">${escapeHTML(habit.name)}</h3>
                            <div class="flex items-center gap-2 mt-1">
                                <span class="inline-flex items-center gap-1 text-xs font-medium ${isActive ? 'text-dashboard-success' : 'text-dashboard-muted'}">
                                    <i class="ph-fill ph-trend-up"></i>
                                    Current Streak: ${streak}
                                </span>
                            </div>
                        </div>
                        <button onclick="openDeleteModal('${habit.id}')" class="text-gray-400 hover:text-dashboard-danger transition-colors p-2 -mr-2 xl:hidden" title="Delete Metric">
                            <i class="ph ph-trash text-lg"></i>
                        </button>
                    </div>
                `;

                // Chain Visualization Section
                const chainWrapper = document.createElement('div');
                chainWrapper.className = "flex-1 overflow-x-auto chain-container pb-2 xl:pb-0";
                
                const chainGrid = document.createElement('div');
                chainGrid.className = "flex items-center gap-3 min-w-max pr-4";

                dates.forEach((dateStr, index) => {
                    const isCompleted = !!habit.history[dateStr];
                    const isToday = dateStr === todayStr;
                    
                    // Check if next day in array (which is tomorrow chronologically) is completed to draw the connecting line
                    const nextDateStr = index < dates.length - 1 ? dates[index + 1] : null;
                    const isNextCompleted = nextDateStr ? !!habit.history[nextDateStr] : false;

                    const nodeWrapper = document.createElement('div');
                    // Add chain-link class to connect adjacent completed nodes
                    nodeWrapper.className = `flex flex-col items-center gap-1.5 shrink-0 ${index !== dates.length - 1 ? 'chain-link w-8' : 'w-8'} ${isCompleted && isNextCompleted ? 'completed' : ''}`;
                    
                    const btn = document.createElement('button');
                    // Base node styling (looks like a data point or commit graph square)
                    btn.className = "w-6 h-6 rounded flex items-center justify-center transition-all duration-200 relative z-10 border";
                    
                    if (isCompleted) {
                        btn.className += " bg-dashboard-success border-dashboard-success text-white node-active shadow-sm";
                        btn.innerHTML = `<i class="ph-bold ph-check text-[10px]"></i>`;
                    } else if (isToday) {
                        btn.className += " bg-gray-50 border-gray-400 border-dashed hover:border-dashboard-primary hover:bg-sky-50";
                    } else {
                        btn.className += " bg-gray-100 border-gray-200 hover:border-gray-300";
                    }

                    btn.onclick = () => toggleDay(habit.id, dateStr);
                    btn.title = new Date(dateStr).toLocaleDateString(); // Tooltip

                    const dateLabel = document.createElement('span');
                    const dayNum = parseInt(dateStr.split('-')[2], 10);
                    dateLabel.className = `text-[9px] font-medium ${isToday ? 'text-dashboard-primary font-bold' : 'text-gray-400'}`;
                    dateLabel.textContent = dayNum;

                    nodeWrapper.appendChild(btn);
                    nodeWrapper.appendChild(dateLabel);
                    chainGrid.appendChild(nodeWrapper);
                });

                chainWrapper.appendChild(chainGrid);

                // Desktop Delete Button
                const actionHtml = `
                    <button onclick="openDeleteModal('${habit.id}')" class="hidden xl:flex text-gray-400 hover:text-dashboard-danger hover:bg-red-50 p-2 rounded transition-colors shrink-0" title="Remove Metric">
                        <i class="ph ph-trash text-lg"></i>
                    </button>
                `;

                // Assemble Card
                card.innerHTML = infoHtml;
                card.appendChild(chainWrapper);
                card.insertAdjacentHTML('beforeend', actionHtml);
                
                habitList.appendChild(card);

                // Auto-scroll to the rightmost (latest) day on load
                requestAnimationFrame(() => {
                    chainWrapper.scrollLeft = chainWrapper.scrollWidth;
                });
            });
        }

        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, 
                tag => ({
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    "'": '&#39;',
                    '"': '&quot;'
                }[tag])
            );
        }

        // Initialize App
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
