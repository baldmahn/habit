<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Performance & Habit Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #0b0f19; color: #ffffff; }
        
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .box-day { width: 28px; height: 28px; flex-shrink: 0; border-radius: 6px; cursor: pointer; transition: all 0.2s; border: 1px solid #1f2739; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600;}
        .box-day:hover { transform: scale(1.1); }
        
        /* Good Habit Colors */
        .good-checked { background: #2ebd85; border-color: #2ebd85; color: #0b0f19; }
        .good-empty { background: #111622; }
        .good-warning { background: #e0294a; border-color: #e0294a; color: white; }

        /* Bad Habit Colors */
        .bad-success { background: #162a22; border-color: #2ebd85; } /* Unchecked is good */
        .bad-warning { background: #d97706; border-color: #d97706; color: white; }
        .bad-fail { background: #e0294a; border-color: #e0294a; color: white; }

        /* Med Colors */
        .med-checked { background: #64b5f6; border-color: #64b5f6; color: #0b0f19; }
        
        details > summary::-webkit-details-marker { display: none; }
    </style>
</head>
<body class="p-4 md:p-8">
    <div class="max-w-4xl mx-auto space-y-6">
        
        <!-- HEADER & TYPE TOGGLE -->
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center border-b border-[#1f2739] pb-4 mb-6 gap-4">
            <div>
                <h1 class="text-2xl font-bold tracking-tight">Performance Tracking</h1>
                <p class="text-xs text-[#8792a3] uppercase tracking-wider mt-1">30-Day Trailing Overview</p>
            </div>
            <div class="flex bg-[#111622] p-1 rounded-lg border border-[#1f2739]">
                <button onclick="setHabitType('good')" id="btn-good" class="px-4 py-1.5 text-sm font-semibold rounded-md bg-[#1f2739] text-white transition-colors">Good Habits</button>
                <button onclick="setHabitType('bad')" id="btn-bad" class="px-4 py-1.5 text-sm font-semibold rounded-md text-[#8792a3] hover:text-white transition-colors">Bad Habits</button>
            </div>
        </div>

        <!-- MAIN TRACKER TABS -->
        <div class="bg-[#111622] border border-[#1f2739] rounded-xl p-5 shadow-lg">
            <div id="habit-tabs" class="flex gap-2 overflow-x-auto hide-scrollbar mb-5 pb-2 border-b border-[#1f2739]">
                <!-- Tabs injected by JS -->
            </div>

            <div id="active-habit-view" class="min-h-[150px]">
                <div class="flex justify-between items-end mb-4">
                    <div>
                        <h2 id="active-habit-name" class="text-xl font-bold text-white">Select a habit</h2>
                        <p id="active-habit-streak" class="text-sm font-mono text-[#8792a3] mt-1">Streak: 0 days</p>
                    </div>
                </div>
                
                <div id="habit-chain" class="flex gap-2 overflow-x-auto hide-scrollbar py-2">
                    <!-- 30 day boxes injected by JS -->
                </div>
                <div class="flex justify-between text-xs text-[#8792a3] mt-2 px-1">
                    <span>30 Days Ago</span>
                    <span>Today</span>
                </div>
            </div>
        </div>

        <!-- ACCORDIONS -->
        <div class="space-y-4">
            
            <!-- DAILY GRATITUDE -->
            <details class="bg-[#111622] border border-[#1f2739] rounded-xl group">
                <summary class="p-5 cursor-pointer flex justify-between items-center text-white hover:bg-[#161c2a] transition-colors rounded-xl">
                    <div class="flex items-center gap-3">
                        <span class="text-lg">🙏</span>
                        <span class="font-semibold uppercase tracking-wider text-sm">Daily Gratitude</span>
                    </div>
                    <span class="text-[#8792a3] group-open:rotate-180 transition-transform duration-300">▼</span>
                </summary>
                <div class="p-5 border-t border-[#1f2739]">
                    <div class="mb-4">
                        <label class="text-xs text-[#8792a3] uppercase tracking-wider mb-2 block">What are you grateful for today?</label>
                        <textarea id="gratitude-input" rows="3" class="w-full bg-[#0b0f19] border border-[#1f2739] rounded-lg p-3 text-white focus:outline-none focus:border-[#2ebd85] transition-colors" placeholder="Today I am grateful for..."></textarea>
                        <button onclick="saveGratitude()" class="mt-3 w-full bg-[#1f2739] hover:bg-[#2ebd85] hover:text-[#0b0f19] text-white font-semibold py-2 px-4 rounded-lg transition-colors">Save Reflection</button>
                    </div>
                    <div id="gratitude-history" class="flex flex-col gap-3 max-h-60 overflow-y-auto pr-2 hide-scrollbar">
                        <!-- History injected by JS -->
                    </div>
                </div>
            </details>

            <!-- MEDICATION LOG -->
            <details class="bg-[#111622] border border-[#1f2739] rounded-xl group">
                <summary class="p-5 cursor-pointer flex justify-between items-center text-white hover:bg-[#161c2a] transition-colors rounded-xl">
                    <div class="flex items-center gap-3">
                        <span class="text-lg">💊</span>
                        <span class="font-semibold uppercase tracking-wider text-sm">Medication Log</span>
                    </div>
                    <span class="text-[#8792a3] group-open:rotate-180 transition-transform duration-300">▼</span>
                </summary>
                <div class="p-5 border-t border-[#1f2739]">
                    <div id="med-tabs" class="flex gap-2 overflow-x-auto hide-scrollbar mb-4">
                        <!-- Med tabs injected by JS -->
                    </div>
                    <div id="active-med-view">
                        <h3 id="active-med-name" class="text-lg font-bold mb-3">Select Medication</h3>
                        <div id="med-chain" class="flex gap-2 overflow-x-auto hide-scrollbar py-2 mb-2">
                            <!-- Med boxes injected by JS -->
                        </div>
                    </div>
                </div>
            </details>

            <!-- MANAGEMENT / SETTINGS -->
            <details class="bg-[#111622] border border-[#1f2739] rounded-xl group">
                <summary class="p-5 cursor-pointer flex justify-between items-center text-white hover:bg-[#161c2a] transition-colors rounded-xl">
                    <div class="flex items-center gap-3">
                        <span class="text-lg">⚙️</span>
                        <span class="font-semibold uppercase tracking-wider text-sm">Manage Trackers</span>
                    </div>
                    <span class="text-[#8792a3] group-open:rotate-180 transition-transform duration-300">▼</span>
                </summary>
                <div class="p-5 border-t border-[#1f2739]">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="text-xs text-[#8792a3] uppercase mb-1 block">New Tracker Name</label>
                            <input type="text" id="new-item-name" class="w-full bg-[#0b0f19] border border-[#1f2739] rounded-lg p-2 text-white" placeholder="e.g., Read 10 Pages">
                        </div>
                        <div>
                            <label class="text-xs text-[#8792a3] uppercase mb-1 block">Tracker Type</label>
                            <select id="new-item-type" class="w-full bg-[#0b0f19] border border-[#1f2739] rounded-lg p-2 text-white">
                                <option value="good">Good Habit</option>
                                <option value="bad">Bad Habit</option>
                                <option value="med">Medication</option>
                            </select>
                        </div>
                    </div>
                    <button onclick="addTracker()" class="mt-4 w-full bg-[#1f2739] hover:bg-white hover:text-black text-white font-semibold py-2 rounded-lg transition-colors">Add Tracker</button>
                </div>
            </details>
        </div>
    </div>

    <script>
        // State
        let data = JSON.parse(localStorage.getItem('trackerData')) || {
            good: {},
            bad: {},
            med: {}
        };
        let gratitudeLog = JSON.parse(localStorage.getItem('gratitudeLog')) || {};
        
        let currentType = 'good';
        let activeIds = { good: null, bad: null, med: null };

        // Initialization
        function init() {
            // Ensure data structure exists
            if (!data.good) data.good = {};
            if (!data.bad) data.bad = {};
            if (!data.med) data.med = {};

            // Set default actives if missing
            ['good', 'bad', 'med'].forEach(type => {
                const keys = Object.keys(data[type]);
                if (keys.length > 0 && !activeIds[type]) activeIds[type] = keys[0];
            });

            renderInterface();
            renderGratitudeHistory();
        }

        function saveData() {
            localStorage.setItem('trackerData', JSON.stringify(data));
        }

        // Generate Last 30 Days
        function getDates() {
            const dates = [];
            for (let i = 29; i >= 0; i--) {
                const d = new Date();
                d.setDate(d.getDate() - i);
                dates.push(d.toISOString().split('T')[0]);
            }
            return dates;
        }

        // Logic & Rendering
        function setHabitType(type) {
            currentType = type;
            document.getElementById('btn-good').className = type === 'good' ? 'px-4 py-1.5 text-sm font-semibold rounded-md bg-[#1f2739] text-white transition-colors' : 'px-4 py-1.5 text-sm font-semibold rounded-md text-[#8792a3] hover:text-white transition-colors';
            document.getElementById('btn-bad').className = type === 'bad' ? 'px-4 py-1.5 text-sm font-semibold rounded-md bg-[#1f2739] text-white transition-colors' : 'px-4 py-1.5 text-sm font-semibold rounded-md text-[#8792a3] hover:text-white transition-colors';
            renderInterface();
        }

        function toggleDay(type, id, date) {
            if (!data[type][id].dates) data[type][id].dates = {};
            data[type][id].dates[date] = !data[type][id].dates[date];
            saveData();
            renderInterface();
        }

        function renderInterface() {
            // 1. Render Main Tabs (Good/Bad)
            const mainTabsContainer = document.getElementById('habit-tabs');
            mainTabsContainer.innerHTML = '';
            const items = Object.entries(data[currentType]);
            
            if (items.length === 0) {
                document.getElementById('active-habit-name').innerText = `No ${currentType} habits yet.`;
                document.getElementById('habit-chain').innerHTML = '';
                document.getElementById('active-habit-streak').innerText = '';
            } else {
                if (!activeIds[currentType] || !data[currentType][activeIds[currentType]]) {
                    activeIds[currentType] = items[0][0];
                }

                items.forEach(([id, item]) => {
                    const btn = document.createElement('button');
                    const isActive = activeIds[currentType] === id;
                    btn.className = `px-4 py-2 text-sm font-medium rounded-lg whitespace-nowrap transition-colors ${isActive ? 'bg-[#1f2739] text-white' : 'text-[#8792a3] hover:bg-[#161c2a]'}`;
                    btn.innerText = item.name;
                    btn.onclick = () => { activeIds[currentType] = id; renderInterface(); };
                    mainTabsContainer.appendChild(btn);
                });

                renderChain(currentType, activeIds[currentType], 'habit-chain');
            }

            // 2. Render Med Tabs
            const medTabsContainer = document.getElementById('med-tabs');
            medTabsContainer.innerHTML = '';
            const meds = Object.entries(data.med);
            
            if (meds.length === 0) {
                document.getElementById('active-med-name').innerText = 'No medications added.';
                document.getElementById('med-chain').innerHTML = '';
            } else {
                if (!activeIds.med || !data.med[activeIds.med]) activeIds.med = meds[0][0];
                
                meds.forEach(([id, item]) => {
                    const btn = document.createElement('button');
                    const isActive = activeIds.med === id;
                    btn.className = `px-3 py-1.5 text-xs font-medium rounded-lg whitespace-nowrap transition-colors ${isActive ? 'bg-[#1f2739] text-[#64b5f6]' : 'text-[#8792a3] hover:bg-[#161c2a]'}`;
                    btn.innerText = item.name;
                    btn.onclick = () => { activeIds.med = id; renderInterface(); };
                    medTabsContainer.appendChild(btn);
                });

                renderChain('med', activeIds.med, 'med-chain');
            }
        }

        function renderChain(type, id, containerId) {
            const container = document.getElementById(containerId);
            container.innerHTML = '';
            const item = data[type][id];
            const dates = getDates();
            
            if (type !== 'med') {
                document.getElementById('active-habit-name').innerText = item.name;
            } else {
                document.getElementById('active-med-name').innerText = item.name;
            }

            let streak = 0;
            let consecutiveMisses = 0;
            let consecutiveFails = 0;

            // Calculate streak (looking backwards from today)
            for (let i = dates.length - 1; i >= 0; i--) {
                const date = dates[i];
                if (type === 'good') {
                    if (item.dates && item.dates[date]) streak++; else break;
                } else if (type === 'bad') {
                    if (!item.dates || !item.dates[date]) streak++; else break;
                }
            }

            if (type !== 'med') {
                const streakText = type === 'good' ? `Streak: ${streak} days` : `Clean: ${streak} days`;
                document.getElementById('active-habit-streak').innerText = streakText;
            }

            // Render boxes
            dates.forEach((date, index) => {
                const box = document.createElement('div');
                const isChecked = item.dates && item.dates[date];
                
                // Styling logic based on type
                if (type === 'good') {
                    if (isChecked) {
                        box.className = 'box-day good-checked';
                        box.innerHTML = '✓';
                        consecutiveMisses = 0;
                    } else {
                        consecutiveMisses++;
                        // If it's today and missed, don't color red yet, unless previous was missed
                        if (consecutiveMisses >= 2 && index < dates.length - 1) {
                            box.className = 'box-day good-warning';
                            box.innerHTML = '!';
                        } else {
                            box.className = 'box-day good-empty';
                        }
                    }
                } else if (type === 'bad') {
                    if (isChecked) {
                        consecutiveFails++;
                        if (consecutiveFails >= 2) {
                            box.className = 'box-day bad-fail';
                            box.innerHTML = 'X';
                        } else {
                            box.className = 'box-day bad-warning';
                            box.innerHTML = '!';
                        }
                    } else {
                        box.className = 'box-day bad-success';
                        consecutiveFails = 0;
                    }
                } else if (type === 'med') {
                    if (isChecked) {
                        box.className = 'box-day med-checked';
                        box.innerHTML = '✓';
                    } else {
                        box.className = 'box-day good-empty';
                    }
                }

                box.title = date;
                box.onclick = () => toggleDay(type, id, date);
                container.appendChild(box);
            });
        }

        // Management
        function addTracker() {
            const name = document.getElementById('new-item-name').value.trim();
            const type = document.getElementById('new-item-type').value;
            
            if (!name) return;
            
            const id = Date.now().toString();
            data[type][id] = { name: name, created: new Date().toISOString().split('T')[0], dates: {} };
            activeIds[type] = id;
            
            if (type === 'good' || type === 'bad') setHabitType(type);
            
            document.getElementById('new-item-name').value = '';
            saveData();
            renderInterface();
        }

        // Gratitude Logic
        function saveGratitude() {
            const input = document.getElementById('gratitude-input');
            const text = input.value.trim();
            if (!text) return;

            const today = new Date().toISOString().split('T')[0];
            gratitudeLog[today] = text;
            localStorage.setItem('gratitudeLog', JSON.stringify(gratitudeLog));
            
            renderGratitudeHistory();
            
            // Visual feedback
            const btn = input.nextElementSibling;
            const originalText = btn.innerText;
            btn.innerText = "Saved!";
            btn.classList.add('bg-[#2ebd85]', 'text-[#0b0f19]');
            setTimeout(() => {
                btn.innerText = originalText;
                btn.classList.remove('bg-[#2ebd85]', 'text-[#0b0f19]');
            }, 2000);
        }

        function renderGratitudeHistory() {
            const container = document.getElementById('gratitude-history');
            container.innerHTML = '';
            
            const dates = Object.keys(gratitudeLog).sort((a, b) => new Date(b) - new Date(a));
            
            if (dates.length === 0) {
                container.innerHTML = '<div class="text-sm text-[#8792a3] italic p-2">No reflections saved yet. Start today!</div>';
            } else {
                dates.forEach(date => {
                    const entryBox = document.createElement('div');
                    entryBox.className = 'bg-[#161c2a] p-3 rounded-lg border border-[#1f2739] text-sm';
                    
                    const dateHeader = document.createElement('div');
                    dateHeader.className = 'text-xs text-[#2ebd85] font-semibold mb-1 tracking-wider';
                    dateHeader.textContent = date;
                    
                    const textContent = document.createElement('div');
                    textContent.className = 'text-[#e2e8f0]';
                    textContent.textContent = gratitudeLog[date];

                    entryBox.appendChild(dateHeader);
                    entryBox.appendChild(textContent);
                    container.appendChild(entryBox);
                });
            }

            const today = new Date().toISOString().split('T')[0];
            const input = document.getElementById('gratitude-input');
            if (gratitudeLog[today]) {
                input.value = gratitudeLog[today];
            }
        }

        init();
    </script>
</body>
</html>
