<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrackerPro Dashboard</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts (Inter) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        dashboard: {
                            bg: '#f8fafc',      /* Slate 50 */
                            card: '#ffffff',
                            border: '#e2e8f0',  /* Slate 200 */
                            text: '#0f172a',    /* Slate 900 */
                            muted: '#64748b',   /* Slate 500 */
                            primary: '#334155', /* Slate 700 */
                            success: '#10b981', /* Emerald 500 */
                            danger: '#ef4444',  /* Red 500 */
                            warning: '#f59e0b', /* Amber 500 */
                        }
                    },
                    boxShadow: {
                        'card': '0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px -1px rgba(0, 0, 0, 0.1)',
                        'tab-good': 'inset 0 -2px 0 0 #10b981',
                        'tab-bad': 'inset 0 -2px 0 0 #ef4444'
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: theme('colors.dashboard.bg');
            color: theme('colors.dashboard.text');
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        /* Scrollbar for the horizontal chain */
        .chain-container::-webkit-scrollbar {
            height: 6px;
        }
        .chain-container::-webkit-scrollbar-track {
            background: theme('colors.slate.100');
            border-radius: 4px;
        }
        .chain-container::-webkit-scrollbar-thumb {
            background-color: theme('colors.slate.300');
            border-radius: 4px;
        }
        .chain-container::-webkit-scrollbar-thumb:hover {
            background-color: theme('colors.slate.400');
        }

        /* Tabs Scrollbar hide */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* Node animation */
        @keyframes pop {
            0% { transform: scale(0.90); opacity: 0.8; }
            50% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }
        .node-active {
            animation: pop 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        /* Accordion transition */
        .accordion-content {
            transition: max-height 0.3s ease-in-out, opacity 0.3s ease-in-out, padding 0.3s ease-in-out;
            max-height: 0;
            opacity: 0;
            overflow: hidden;
            padding-top: 0;
            padding-bottom: 0;
        }
        .accordion-content.open {
            max-height: 500px; 
            opacity: 1;
            padding-top: 1.5rem; 
            padding-bottom: 1.5rem;
        }
        
        .accordion-icon {
            transition: transform 0.3s ease;
        }
        .accordion-icon.open {
            transform: rotate(180deg);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center py-8 px-4 sm:px-6">

    <main class="w-full max-w-4xl flex flex-col gap-6">
        
        <!-- Header -->
        <header class="flex items-center justify-between bg-white p-5 rounded-xl border border-dashboard-border shadow-card">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-lg bg-slate-900 flex items-center justify-center text-white shadow-sm">
                    <i class="ph ph-chart-polar text-2xl"></i>
                </div>
                <div>
                    <h1 class="font-bold text-xl leading-tight text-dashboard-text">Tracker<span class="text-dashboard-success">Pro</span></h1>
                    <p class="text-xs text-dashboard-muted font-medium uppercase tracking-wider" id="headerDate"></p>
                </div>
            </div>
            <div class="text-right hidden sm:block">
                <p class="text-sm text-dashboard-muted">Dashboard Status</p>
                <p class="text-sm font-semibold text-dashboard-success flex items-center justify-end gap-1">
                    <span class="w-2 h-2 rounded-full bg-dashboard-success animate-pulse"></span> Synchronized
                </p>
            </div>
        </header>

        <!-- TOP SECTION: Tabbed Habit Tracker -->
        <section class="bg-white rounded-xl border border-dashboard-border shadow-card overflow-hidden flex flex-col">
            
            <!-- Habit Type Toggle -->
            <div class="bg-slate-50 border-b border-dashboard-border p-3 flex justify-center sm:justify-start">
                <div class="inline-flex bg-slate-200/70 p-1 rounded-lg">
                    <button id="toggleGoodBtn" onclick="setActiveType('good')" class="px-4 py-1.5 rounded-md text-sm font-medium transition-all bg-white text-dashboard-text shadow-sm ring-1 ring-slate-900/5">
                        <i class="ph ph-trend-up text-dashboard-success mr-1"></i> Good Habits
                    </button>
                    <button id="toggleBadBtn" onclick="setActiveType('bad')" class="px-4 py-1.5 rounded-md text-sm font-medium transition-all text-dashboard-muted hover:text-dashboard-text">
                        <i class="ph ph-trend-down text-dashboard-danger mr-1"></i> Bad Habits
                    </button>
                </div>
            </div>

            <!-- Tabs Header -->
            <div class="border-b border-dashboard-border bg-slate-50 px-2 pt-2 flex overflow-x-auto no-scrollbar" id="tabsContainer">
                <!-- Tabs injected via JS -->
            </div>

            <!-- Active Habit Content -->
            <div class="p-6 md:p-8 flex flex-col min-h-[250px]" id="activeHabitContainer">
                <!-- Populated via JS -->
                <div id="emptyTabsState" class="flex flex-col items-center justify-center py-10 text-center h-full">
                    <div class="w-16 h-16 bg-slate-100 rounded-full flex items-center justify-center mb-4 text-slate-400">
                        <i class="ph ph-target text-3xl"></i>
                    </div>
                    <h3 class="text-lg font-semibold text-dashboard-text">No Trackers Found</h3>
                    <p class="text-sm text-dashboard-muted mt-1 max-w-sm">You haven't set up any habits for this category yet. Use the accordion below to add one.</p>
                </div>
            </div>
        </section>

        <!-- BOTTOM SECTION: Accordions -->
        <section class="flex flex-col gap-3">
            
            <!-- Accordion 1: Add New Habit -->
            <div class="bg-white rounded-xl border border-dashboard-border shadow-card overflow-hidden">
                <button class="w-full px-6 py-4 flex items-center justify-between bg-white hover:bg-slate-50 transition-colors" onclick="toggleAccordion('addHabitAccordion')">
                    <div class="flex items-center gap-3">
                        <div class="w-8 h-8 rounded bg-slate-100 text-slate-600 flex items-center justify-center">
                            <i class="ph ph-plus text-lg"></i>
                        </div>
                        <span class="font-semibold text-dashboard-text">Add New Tracker</span>
                    </div>
                    <i class="ph ph-caret-down text-dashboard-muted accordion-icon" id="addHabitAccordion-icon"></i>
                </button>
                <div id="addHabitAccordion-content" class="accordion-content px-6 border-t border-dashboard-border bg-slate-50/50">
                    <div class="flex flex-col gap-4">
                        <div class="flex gap-4 mb-2">
                            <label class="flex items-center gap-2 cursor-pointer">
                                <input type="radio" name="habitType" value="good" checked class="text-dashboard-success focus:ring-dashboard-success w-4 h-4">
                                <span class="text-sm font-medium text-dashboard-text">Good Habit (Build)</span>
                            </label>
                            <label class="flex items-center gap-2 cursor-pointer">
                                <input type="radio" name="habitType" value="bad" class="text-dashboard-danger focus:ring-dashboard-danger w-4 h-4">
                                <span class="text-sm font-medium text-dashboard-text">Bad Habit (Quit)</span>
                            </label>
                        </div>
                        <div class="flex flex-col sm:flex-row gap-4 items-center">
                            <div class="flex-1 w-full relative">
                                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                    <i class="ph ph-tag text-slate-400"></i>
                                </div>
                                <input 
                                    type="text" 
                                    id="habitInput" 
                                    class="block w-full pl-10 pr-3 py-2.5 border border-slate-300 rounded-lg bg-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-slate-400 focus:border-slate-400 text-sm transition-shadow" 
                                    placeholder="e.g., Read 30 mins (Good) or Smoke (Bad)"
                                >
                            </div>
                            <button 
                                id="addHabitBtn"
                                class="w-full sm:w-auto bg-slate-900 hover:bg-slate-800 text-white px-6 py-2.5 rounded-lg font-medium text-sm transition-colors shadow-sm whitespace-nowrap"
                            >
                                Initialize Tracker
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Accordion 2: Analysis / Stats -->
            <div class="bg-white rounded-xl border border-dashboard-border shadow-card overflow-hidden">
                <button class="w-full px-6 py-4 flex items-center justify-between bg-white hover:bg-slate-50 transition-colors" onclick="toggleAccordion('analysisAccordion')">
                    <div class="flex items-center gap-3">
                        <div class="w-8 h-8 rounded bg-slate-100 text-slate-600 flex items-center justify-center">
                            <i class="ph ph-chart-line-up text-lg"></i>
                        </div>
                        <span class="font-semibold text-dashboard-text">Analysis & Statistics</span>
                    </div>
                    <i class="ph ph-caret-down text-dashboard-muted accordion-icon" id="analysisAccordion-icon"></i>
                </button>
                <div id="analysisAccordion-content" class="accordion-content px-6 border-t border-dashboard-border bg-slate-50/50">
                    <div id="analysisContent" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                        <!-- Populated via JS -->
                    </div>
                </div>
            </div>

            <!-- Accordion 3: Settings -->
            <div class="bg-white rounded-xl border border-dashboard-border shadow-card overflow-hidden">
                <button class="w-full px-6 py-4 flex items-center justify-between bg-white hover:bg-slate-50 transition-colors" onclick="toggleAccordion('settingsAccordion')">
                    <div class="flex items-center gap-3">
                        <div class="w-8 h-8 rounded bg-slate-100 text-slate-600 flex items-center justify-center">
                            <i class="ph ph-gear text-lg"></i>
                        </div>
                        <span class="font-semibold text-dashboard-text">System Settings</span>
                    </div>
                    <i class="ph ph-caret-down text-dashboard-muted accordion-icon" id="settingsAccordion-icon"></i>
                </button>
                <div id="settingsAccordion-content" class="accordion-content px-6 border-t border-dashboard-border bg-slate-50/50">
                    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center p-4 bg-white border border-red-100 rounded-lg">
                        <div>
                            <h4 class="text-sm font-semibold text-dashboard-text">Danger Zone</h4>
                            <p class="text-xs text-dashboard-muted mt-1">Permanently delete all trackers, categories, and historical data.</p>
                        </div>
                        <button onclick="clearAllData()" class="mt-3 sm:mt-0 px-4 py-2 bg-red-50 text-dashboard-danger hover:bg-red-100 hover:text-red-700 rounded-lg text-sm font-medium transition-colors border border-red-200">
                            Clear Database
                        </button>
                    </div>
                </div>
            </div>

        </section>
    </main>

    <script>
        // State Management
        const STORAGE_KEY = 'tracker_pro_v3';
        const DAYS_TO_SHOW = 30;
        let habits = [];
        let activeType = 'good'; // 'good' or 'bad'
        let activeHabitId = null;

        // DOM Elements
        const headerDate = document.getElementById('headerDate');
        const tabsContainer = document.getElementById('tabsContainer');
        const activeHabitContainer = document.getElementById('activeHabitContainer');
        const emptyTabsState = document.getElementById('emptyTabsState');
        
        const habitInput = document.getElementById('habitInput');
        const addHabitBtn = document.getElementById('addHabitBtn');
        const analysisContent = document.getElementById('analysisContent');

        function init() {
            // Set Header Date
            const now = new Date();
            headerDate.textContent = now.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });

            // Load Data
            try {
                const data = localStorage.getItem(STORAGE_KEY);
                if (data) habits = JSON.parse(data);
            } catch (e) {
                console.error("Failed to load data", e);
                habits = [];
            }

            // Bind Events
            addHabitBtn.addEventListener('click', handleAddHabit);
            habitInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') handleAddHabit();
            });

            // Set initial state
            updateActiveHabitIdForType();
            
            // Open 'Add Habit' accordion by default if no habits exist
            if (habits.length === 0) {
                toggleAccordion('addHabitAccordion');
            }

            renderAll();
        }

        // Utilities
        function formatDate(date) {
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        function getPastDates(numDays) {
            const dates = [];
            const today = new Date();
            for (let i = numDays - 1; i >= 0; i--) {
                const d = new Date(today);
                d.setDate(today.getDate() - i);
                dates.push(formatDate(d));
            }
            return dates;
        }
        
        function getHabitsByType(type) {
            return habits.filter(h => h.type === type);
        }

        function updateActiveHabitIdForType() {
            const currentHabits = getHabitsByType(activeType);
            if (!currentHabits.find(h => h.id === activeHabitId)) {
                activeHabitId = currentHabits.length > 0 ? currentHabits[0].id : null;
            }
        }

        function calculateStreak(habit) {
            let streak = 0;
            const today = new Date();
            let currentDateStr = formatDate(today);
            
            // For BAD habits: streak is consecutive UNCHECKED days since creation
            // For GOOD habits: streak is consecutive CHECKED days
            const isGood = habit.type === 'good';

            // Check today. If not maintaining streak today, check yesterday.
            let activeToday = isGood ? habit.history[currentDateStr] : !habit.history[currentDateStr];
            
            if (!activeToday) {
                const yesterday = new Date(today);
                yesterday.setDate(today.getDate() - 1);
                currentDateStr = formatDate(yesterday);
                
                // Check if streak was valid yesterday.
                // For bad habits, also ensure yesterday is >= createdAt
                if (currentDateStr < habit.createdAt) return 0;
                let activeYesterday = isGood ? habit.history[currentDateStr] : !habit.history[currentDateStr];
                
                if (!activeYesterday) return 0;
            }

            let d = new Date(currentDateStr);
            while (true) {
                const dateStr = formatDate(d);
                if (dateStr < habit.createdAt) break; // Don't count before habit existed
                
                let active = isGood ? habit.history[dateStr] : !habit.history[dateStr];
                if (active) {
                    streak++;
                    d.setDate(d.getDate() - 1);
                } else {
                    break;
                }
            }
            return streak;
        }

        function calculateMaxStreak(habit) {
            const isGood = habit.type === 'good';
            let max = 0;
            let current = 0;
            
            // Analyze all days from creation to today
            const start = new Date(habit.createdAt);
            const end = new Date();
            
            // Normalizing dates to prevent time-of-day offset issues
            start.setHours(0,0,0,0);
            end.setHours(0,0,0,0);

            let d = new Date(start);
            while (d <= end) {
                const dateStr = formatDate(d);
                let active = isGood ? habit.history[dateStr] : !habit.history[dateStr];
                
                if (active) {
                    current++;
                    if (current > max) max = current;
                } else {
                    current = 0;
                }
                d.setDate(d.getDate() + 1);
            }
            return max;
        }

        function saveData() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(habits));
            renderAll();
        }

        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, tag => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
            }[tag]));
        }

        function setActiveType(type) {
            activeType = type;
            
            // Update Toggle UI
            const goodBtn = document.getElementById('toggleGoodBtn');
            const badBtn = document.getElementById('toggleBadBtn');
            
            if (type === 'good') {
                goodBtn.className = "px-4 py-1.5 rounded-md text-sm font-medium transition-all bg-white text-dashboard-text shadow-sm ring-1 ring-slate-900/5";
                badBtn.className = "px-4 py-1.5 rounded-md text-sm font-medium transition-all text-dashboard-muted hover:text-dashboard-text";
            } else {
                badBtn.className = "px-4 py-1.5 rounded-md text-sm font-medium transition-all bg-white text-dashboard-text shadow-sm ring-1 ring-slate-900/5";
                goodBtn.className = "px-4 py-1.5 rounded-md text-sm font-medium transition-all text-dashboard-muted hover:text-dashboard-text";
            }

            updateActiveHabitIdForType();
            renderAll();
        }

        function handleAddHabit() {
            const name = habitInput.value.trim();
            if (!name) return;

            const typeRadios = document.getElementsByName('habitType');
            let selectedType = 'good';
            for (let radio of typeRadios) {
                if (radio.checked) {
                    selectedType = radio.value;
                    break;
                }
            }

            const newHabit = {
                id: crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(),
                name: name,
                type: selectedType,
                history: {},
                createdAt: formatDate(new Date()) // Store format YYYY-MM-DD
            };

            habits.push(newHabit);
            
            // Switch to the newly created habit's category and select it
            setActiveType(selectedType);
            activeHabitId = newHabit.id; 
            
            habitInput.value = '';
            
            // Close add accordion if it's open
            const content = document.getElementById('addHabitAccordion-content');
            if (content.classList.contains('open')) {
                toggleAccordion('addHabitAccordion');
            }

            saveData();
        }

        function toggleDay(dateStr) {
            if (!activeHabitId) return;
            const habit = habits.find(h => h.id === activeHabitId);
            if (!habit) return;
            
            if (dateStr < habit.createdAt) return; // Cannot edit before creation

            if (habit.history[dateStr]) {
                delete habit.history[dateStr];
            } else {
                habit.history[dateStr] = true;
            }
            saveData();
        }

        function setActiveTab(id) {
            activeHabitId = id;
            renderAll();
        }

        function deleteHabit(id) {
            if(confirm("Are you sure you want to permanently delete this tracker?")) {
                habits = habits.filter(h => h.id !== id);
                updateActiveHabitIdForType();
                saveData();
            }
        }

        function clearAllData() {
            if(confirm("CRITICAL WARNING: This will delete ALL habits and history. Proceed?")) {
                habits = [];
                activeHabitId = null;
                saveData();
                toggleAccordion('settingsAccordion');
            }
        }

        function toggleAccordion(id) {
            const content = document.getElementById(`${id}-content`);
            const icon = document.getElementById(`${id}-icon`);
            
            if (content.classList.contains('open')) {
                content.classList.remove('open');
                icon.classList.remove('open');
            } else {
                content.classList.add('open');
                icon.classList.add('open');
            }
        }

        function renderAll() {
            renderTabs();
            renderActiveHabit();
            renderAnalysis();
        }

        function renderTabs() {
            tabsContainer.innerHTML = '';
            
            const currentHabits = getHabitsByType(activeType);
            
            if (currentHabits.length === 0) return;

            currentHabits.forEach(habit => {
                const isActive = habit.id === activeHabitId;
                const btn = document.createElement('button');
                
                const shadowClass = activeType === 'good' ? 'shadow-tab-good' : 'shadow-tab-bad';
                
                btn.className = `px-5 py-3 text-sm font-medium whitespace-nowrap rounded-t-lg transition-all flex items-center gap-2 ${
                    isActive 
                    ? `bg-white text-dashboard-text ${shadowClass} relative z-10` 
                    : 'text-dashboard-muted hover:text-dashboard-text hover:bg-slate-100'
                }`;
                
                btn.onclick = () => setActiveTab(habit.id);
                
                // Indicator: For good habits, checking today is good. For bad, checking today is bad.
                const todayStr = formatDate(new Date());
                const isCheckedToday = !!habit.history[todayStr];
                
                let indicatorHTML = '';
                if (activeType === 'good') {
                    indicatorHTML = isCheckedToday 
                        ? `<span class="w-2 h-2 rounded-full bg-dashboard-success"></span>`
                        : `<span class="w-2 h-2 rounded-full bg-slate-200 border border-slate-300"></span>`;
                } else {
                    // Bad habit: checked is bad (red), unchecked is good (green/gray)
                    indicatorHTML = isCheckedToday
                        ? `<span class="w-2 h-2 rounded-full bg-dashboard-danger"></span>`
                        : `<span class="w-2 h-2 rounded-full bg-dashboard-success"></span>`;
                }

                btn.innerHTML = `${indicatorHTML} ${escapeHTML(habit.name)}`;
                tabsContainer.appendChild(btn);
            });
        }

        function renderActiveHabit() {
            const currentHabits = getHabitsByType(activeType);
            
            if (!activeHabitId || currentHabits.length === 0) {
                emptyTabsState.style.display = 'flex';
                Array.from(activeHabitContainer.children).forEach(child => {
                    if (child.id !== 'emptyTabsState') child.remove();
                });
                return;
            }

            emptyTabsState.style.display = 'none';
            const habit = currentHabits.find(h => h.id === activeHabitId);
            if (!habit) return;

            const streak = calculateStreak(habit);
            const maxStreak = calculateMaxStreak(habit);
            const dates = getPastDates(DAYS_TO_SHOW);
            const todayStr = formatDate(new Date());
            const isGood = habit.type === 'good';

            const streakColor = streak > 0 
                ? (isGood ? 'text-dashboard-success' : 'text-dashboard-success') // Both use green to signify a good streak
                : 'text-dashboard-muted';
                
            const headerIcon = isGood ? 'ph-trend-up' : 'ph-shield-check';

            let html = `
                <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-6">
                    <div>
                        <h2 class="text-2xl font-bold text-dashboard-text">${escapeHTML(habit.name)}</h2>
                        <div class="flex items-center gap-4 mt-2">
                            <span class="inline-flex items-center gap-1.5 text-sm font-medium ${streakColor} bg-slate-50 px-2.5 py-1 rounded border border-slate-200 shadow-sm">
                                <i class="${streak > 0 ? 'ph-fill' : 'ph'} ${headerIcon}"></i>
                                Current Streak: ${streak}
                            </span>
                            <span class="text-xs text-dashboard-muted font-medium">Best: ${maxStreak}</span>
                        </div>
                    </div>
                    <button onclick="deleteHabit('${habit.id}')" class="text-slate-400 hover:text-dashboard-danger hover:bg-red-50 px-3 py-1.5 rounded-lg transition-colors text-sm font-medium flex items-center gap-2 self-start sm:self-auto border border-transparent hover:border-red-100">
                        <i class="ph ph-trash"></i> Delete
                    </button>
                </div>

                <div class="mb-2 flex justify-between items-center text-xs font-semibold uppercase tracking-wider">
                    <span class="text-dashboard-muted">Past ${DAYS_TO_SHOW} Days</span>
                    <span class="text-slate-400">Created: ${habit.createdAt}</span>
                </div>
                
                <div class="chain-container overflow-x-auto pb-4 -mx-2 px-2" id="gridContainer">
                    <div class="flex items-center gap-2 min-w-max h-16">
            `;

            dates.forEach((dateStr, index) => {
                const isCompleted = !!habit.history[dateStr]; // true if clicked
                const isToday = dateStr === todayStr;
                const isBeforeCreation = dateStr < habit.createdAt;
                
                const d = new Date(dateStr);
                const dayNum = d.getDate();
                const dayName = d.toLocaleDateString('en-US', { weekday: 'short' }).charAt(0);

                let btnClasses = "w-10 h-10 rounded-lg flex flex-col items-center justify-center transition-all duration-200 border-2 relative group shadow-sm";
                let textClasses = "text-[10px] font-bold z-10";
                let iconHTML = '';
                
                if (isBeforeCreation) {
                    btnClasses += " bg-slate-100 border-slate-200 opacity-50 cursor-not-allowed";
                    textClasses += " text-slate-300";
                    iconHTML = `<i class="ph ph-minus text-slate-300 z-10"></i>`;
                } else {
                    btnClasses += " cursor-pointer";
                    
                    // Logic for adjacent days to check for consecutive states
                    const prevDate = dates[index - 1];
                    const nextDate = dates[index + 1];
                    
                    if (isGood) {
                        if (isCompleted) {
                            // Good Habit: Success
                            btnClasses += " bg-dashboard-success border-dashboard-success text-white node-active shadow-sm";
                            iconHTML = `<i class="ph-bold ph-check text-base z-10 text-white"></i>`;
                        } else {
                            // Good Habit: Missed
                            let isConsecutiveMiss = false;
                            if ((prevDate && prevDate >= habit.createdAt && !habit.history[prevDate]) || 
                                (nextDate && nextDate >= habit.createdAt && !habit.history[nextDate])) {
                                isConsecutiveMiss = true;
                            }
                            
                            if (isConsecutiveMiss) {
                                // Red Warning for breaking chain > 1 day
                                btnClasses += " bg-red-50 border-red-300 hover:bg-red-100 hover:border-red-400";
                                textClasses += " text-red-600";
                                iconHTML = `<span class="${textClasses}">${dayNum}</span>`;
                            } else {
                                // Normal single miss
                                btnClasses += isToday 
                                    ? " bg-emerald-50/50 border-emerald-200 hover:border-dashboard-success text-dashboard-primary"
                                    : " bg-white border-slate-200 hover:border-slate-300 hover:bg-slate-50 text-slate-500";
                                iconHTML = `<span class="${textClasses}">${dayNum}</span>`;
                            }
                        }
                    } else {
                        // Bad Habit Logic
                        if (isCompleted) {
                            // Bad Habit: Failed (User did the bad habit)
                            let isConsecutiveFail = false;
                            if ((prevDate && prevDate >= habit.createdAt && habit.history[prevDate]) || 
                                (nextDate && nextDate >= habit.createdAt && habit.history[nextDate])) {
                                isConsecutiveFail = true;
                            }

                            if (isConsecutiveFail) {
                                btnClasses += " bg-dashboard-danger border-dashboard-danger text-white node-active";
                                iconHTML = `<i class="ph-bold ph-x text-base z-10 text-white"></i>`;
                            } else {
                                // Warning single failure
                                btnClasses += " bg-orange-100 border-dashboard-warning text-dashboard-warning node-active";
                                iconHTML = `<i class="ph-bold ph-x text-base z-10 text-dashboard-warning"></i>`;
                            }
                        } else {
                            // Bad Habit: Success (Resisted)
                            btnClasses += " bg-emerald-50/40 border-emerald-100 hover:border-emerald-300 text-emerald-700";
                            iconHTML = `<span class="${textClasses} text-emerald-700">${dayNum}</span>`;
                        }
                    }
                }

                html += `
                    <div class="flex flex-col items-center gap-1">
                        <span class="text-[9px] font-medium text-slate-400 uppercase">${dayName}</span>
                        <button class="${btnClasses}" ${!isBeforeCreation ? `onclick="toggleDay('${dateStr}')"` : ''} title="${d.toLocaleDateString()}">
                            ${iconHTML}
                        </button>
                    </div>
                `;
            });

            html += `
                    </div>
                </div>
                
                <div class="mt-2 text-xs flex gap-4 text-dashboard-muted">
                    <div class="flex items-center gap-1"><span class="w-3 h-3 rounded bg-dashboard-success block"></span> Success</div>
                    ${isGood 
                        ? `<div class="flex items-center gap-1"><span class="w-3 h-3 rounded border border-red-300 bg-red-50 block"></span> 2+ Days Skipped</div>`
                        : `<div class="flex items-center gap-1"><span class="w-3 h-3 rounded bg-dashboard-danger block"></span> 2+ Days Failed</div>
                           <div class="flex items-center gap-1"><span class="w-3 h-3 rounded border border-dashboard-warning bg-orange-100 block"></span> 1 Day Failed</div>`
                    }
                </div>
            `;

            Array.from(activeHabitContainer.children).forEach(child => {
                if (child.id !== 'emptyTabsState') child.remove();
            });

            const wrapper = document.createElement('div');
            wrapper.innerHTML = html;
            activeHabitContainer.appendChild(wrapper);

            setTimeout(() => {
                const grid = document.getElementById('gridContainer');
                if (grid) grid.scrollLeft = grid.scrollWidth;
            }, 10);
        }

        function renderAnalysis() {
            if (habits.length === 0) {
                analysisContent.innerHTML = `<div class="col-span-full text-center text-sm text-dashboard-muted py-6">Add a tracker to see analysis.</div>`;
                return;
            }

            let goodHabitsCount = 0;
            let badHabitsCount = 0;
            let highestGoodStreak = 0;
            let highestBadStreak = 0;
            let totalGoodCompletions = 0;
            let totalBadResisted = 0;

            habits.forEach(h => {
                const maxS = calculateMaxStreak(h);
                
                if (h.type === 'good') {
                    goodHabitsCount++;
                    totalGoodCompletions += Object.keys(h.history).length;
                    if (maxS > highestGoodStreak) highestGoodStreak = maxS;
                } else {
                    badHabitsCount++;
                    // For bad habits, resisted days = total days since creation minus failed days
                    const start = new Date(h.createdAt);
                    const end = new Date();
                    start.setHours(0,0,0,0);
                    end.setHours(0,0,0,0);
                    const totalDays = Math.max(0, Math.floor((end - start) / (1000 * 60 * 60 * 24)) + 1);
                    const failedDays = Object.keys(h.history).length;
                    totalBadResisted += (totalDays - failedDays);
                    
                    if (maxS > highestBadStreak) highestBadStreak = maxS;
                }
            });

            analysisContent.innerHTML = `
                <div class="bg-white border border-dashboard-border p-4 rounded-xl flex flex-col justify-center items-center text-center shadow-sm">
                    <span class="text-[10px] font-bold text-dashboard-muted uppercase tracking-widest mb-1">Good Habits Built</span>
                    <span class="text-2xl font-bold text-dashboard-text">${totalGoodCompletions}</span>
                    <span class="text-[10px] text-dashboard-muted mt-1">Total Days Completed</span>
                </div>
                
                <div class="bg-white border border-dashboard-border p-4 rounded-xl flex flex-col justify-center items-center text-center shadow-sm">
                    <span class="text-[10px] font-bold text-dashboard-muted uppercase tracking-widest mb-1">Bad Habits Resisted</span>
                    <span class="text-2xl font-bold text-dashboard-text">${totalBadResisted}</span>
                    <span class="text-[10px] text-dashboard-muted mt-1">Total Days Resisted</span>
                </div>
                
                <div class="bg-white border border-dashboard-border p-4 rounded-xl flex flex-col justify-center items-center text-center shadow-sm">
                    <span class="text-[10px] font-bold text-dashboard-muted uppercase tracking-widest mb-1">Best Good Streak</span>
                    <span class="text-2xl font-bold text-dashboard-success">${highestGoodStreak}</span>
                    <span class="text-[10px] text-dashboard-muted mt-1">Record across good habits</span>
                </div>
                
                <div class="bg-white border border-dashboard-border p-4 rounded-xl flex flex-col justify-center items-center text-center shadow-sm">
                    <span class="text-[10px] font-bold text-dashboard-muted uppercase tracking-widest mb-1">Best Quit Streak</span>
                    <span class="text-2xl font-bold text-dashboard-success">${highestBadStreak}</span>
                    <span class="text-[10px] text-dashboard-muted mt-1">Record across bad habits</span>
                </div>
            `;
        }

        // Run Init
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
